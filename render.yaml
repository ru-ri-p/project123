# Render Blueprint — DEFAULT (hosted) configuration.
#
# Render's Blueprint feature auto-reads this file (render.yaml). This is the
# RECOMMENDED pilot model: the Attest provider runs the service and hands the
# design partner only the SDK + a URL + an API key. The API is a PUBLIC web
# service (HTTPS URL the partner's app can reach), protected by API-key auth +
# rate limiting + Render's automatic TLS.
#
# For the internal-only, partner-self-hosts-everything variant, see
# render.selfhost.yaml (and docs/PILOT_RUNBOOK.md).
#
# Manual step (a secret, cannot live here): generate the Ed25519 keypair
# (scripts/generate_keys.py) and add BOTH as Render "Secret Files" on
# attest-api AND attest-seal-anchor, mounted at:
#     /etc/secrets/ed25519_private.pem
#     /etc/secrets/ed25519_public.pem

databases:
  - name: attest-db
    databaseName: attest
    user: attest
    postgresMajorVersion: "16"
    plan: free          # bump to starter/standard beyond the pilot

services:
  # --- Attest API: PUBLIC web service (HTTPS URL the partner app calls) -----
  - type: web
    name: attest-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter        # 'free' also works but sleeps when idle (cold starts)
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attest-db
          property: connectionString
      - key: SIGNING_BACKEND
        value: local
      - key: SIGNING_PRIVATE_KEY_PATH
        value: /etc/secrets/ed25519_private.pem
      - key: SIGNING_PUBLIC_KEY_PATH
        value: /etc/secrets/ed25519_public.pem
      - key: TSA_URL
        value: https://freetsa.org/tsr
      # Admin key for the consent-access endpoints (POST /v1/admin/access-requests,
      # GET /v1/admin/.../records/...). Attest ops use it to file requests and read
      # a record via an approved grant. sync:false = set the value in the Render
      # dashboard, never in git (CLAUDE.md rule 5). If unset, admin routes 503.
      - key: ADMIN_API_KEY
        sync: false

  # --- Regulation watch cron ------------------------------------------------
  # Runs where outbound access to the regulator sites exists. Auto-publishes only
  # what is provable verbatim against the fetched official text; anything needing
  # judgement is quarantined for review in /admin.
  - type: cron
    name: attest-regwatch
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "0 3 * * *"
    dockerCommand: python scripts/watch_regulations.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attest-db
          property: connectionString
      - key: SIGNING_BACKEND
        value: local
      - key: SIGNING_PRIVATE_KEY_PATH
        value: /etc/secrets/ed25519_private.pem
      - key: SIGNING_PUBLIC_KEY_PATH
        value: /etc/secrets/ed25519_public.pem
      # Set to "false" to monitor without publishing anything.
      - key: REGWATCH_AUTO_PUBLISH
        value: "true"

  # --- Seal + anchor cron job ---------------------------------------------
  - type: cron
    name: attest-seal-anchor
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    dockerCommand: python scripts/seal_and_anchor.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attest-db
          property: connectionString
      - key: SIGNING_BACKEND
        value: local
      - key: SIGNING_PRIVATE_KEY_PATH
        value: /etc/secrets/ed25519_private.pem
      - key: SIGNING_PUBLIC_KEY_PATH
        value: /etc/secrets/ed25519_public.pem
      - key: TSA_URL
        value: https://freetsa.org/tsr
