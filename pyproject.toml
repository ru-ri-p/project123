[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attest-sdk"
version = "0.1.0"
description = "Attest Python SDK — record tamper-evident, signed provenance events for AI workflows."
requires-python = ">=3.11"
# cryptography is a BASE dependency, not an extra: offline resilience is on by
# default (an Attest outage must not create a hole in the audit trail), and it
# needs the device signing key and the encrypted local buffer. Making it opt-in
# would mean the safe behaviour is the one nobody installs.
dependencies = ["requests>=2.32.0", "cryptography>=43.0.0"]
readme = "attest_sdk/README.md"

# Kept so existing `attest-sdk[consent]` installs keep working; it now resolves
# to the same set as the base install.
[project.optional-dependencies]
consent = ["cryptography>=43.0.0"]
offline = ["cryptography>=43.0.0"]

[tool.setuptools]
packages = ["attest_sdk", "attest_sdk.policy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"attest_sdk/buffer.py" = ["BLE001"]
"alembic/versions/*" = ["E501"]
"app/api/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alembic.*", "alembic.versions.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
