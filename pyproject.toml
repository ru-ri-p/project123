[project]
name = "attest"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"sdk/buffer.py" = ["BLE001"]
"alembic/versions/*" = ["E501"]
"app/api/*" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alembic.*", "alembic.versions.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
