# Render Blueprint — SELF-HOST (internal-only) variant.
#
# Use this when the design partner runs the WHOLE service on their own Render
# account and the API must NOT be publicly reachable. Difference from the
# default render.yaml: attest-api is a PRIVATE service (internal-only, no public
# URL), reachable only inside the partner's Render network.
#
# NOTE: Render Blueprints auto-read `render.yaml`. To deploy THIS variant,
# either copy it over render.yaml on your branch (`cp render.selfhost.yaml
# render.yaml`) before running the Blueprint, or create the resources manually
# (New + → Private Service / PostgreSQL / Cron Job) with the env vars below.
#
# Manual step (a secret, cannot live here): generate the Ed25519 keypair
# (scripts/generate_keys.py) and add BOTH as Render "Secret Files" on
# attest-api AND attest-seal-anchor, mounted at:
#     /etc/secrets/ed25519_private.pem
#     /etc/secrets/ed25519_public.pem

databases:
  - name: attest-db
    databaseName: attest
    user: attest
    postgresMajorVersion: "16"
    plan: free          # bump to starter/standard beyond the pilot

services:
  # --- Attest API: PRIVATE service (internal-only) -------------------------
  - type: pserv
    name: attest-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attest-db
          property: connectionString
      - key: SIGNING_BACKEND
        value: local
      - key: SIGNING_PRIVATE_KEY_PATH
        value: /etc/secrets/ed25519_private.pem
      - key: SIGNING_PUBLIC_KEY_PATH
        value: /etc/secrets/ed25519_public.pem
      - key: TSA_URL
        value: https://freetsa.org/tsr

  # --- Seal + anchor cron job ---------------------------------------------
  - type: cron
    name: attest-seal-anchor
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    dockerCommand: python scripts/seal_and_anchor.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attest-db
          property: connectionString
      - key: SIGNING_BACKEND
        value: local
      - key: SIGNING_PRIVATE_KEY_PATH
        value: /etc/secrets/ed25519_private.pem
      - key: SIGNING_PUBLIC_KEY_PATH
        value: /etc/secrets/ed25519_public.pem
      - key: TSA_URL
        value: https://freetsa.org/tsr
