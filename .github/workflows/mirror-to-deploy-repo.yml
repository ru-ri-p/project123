# Mirror main to the deploy repo.
#
# Development happens in this repo (shaundytradesfx/govproject01), but Render's
# attest-api service deploys from ru-ri-p/project123. Without a mirror the two
# drift apart and Render silently keeps serving stale code — which is exactly
# what happened before this workflow existed.
#
# Requires a repository secret named MIRROR_TOKEN: a GitHub token with
# Contents: write on ru-ri-p/project123. See docs/DEPLOY_MIRROR.md for setup.

name: Mirror main to deploy repo

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you mirror on demand from the Actions tab

# One mirror at a time; never let two runs race to push the same branch.
concurrency:
  group: mirror-to-deploy-repo
  cancel-in-progress: false

env:
  DEPLOY_REPO: ru-ri-p/project123
  DEPLOY_BRANCH: main

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # A shallow clone cannot be pushed to a different repository.
          fetch-depth: 0

      - name: Push main to the deploy repo
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "::error::MIRROR_TOKEN secret is not set."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "See docs/DEPLOY_MIRROR.md for how to create the token."
            exit 1
          fi

          # The token is a registered secret, so Actions masks it in the logs.
          REMOTE="https://x-access-token:${MIRROR_TOKEN}@github.com/${DEPLOY_REPO}.git"

          echo "Mirroring $(git rev-parse --short HEAD) -> ${DEPLOY_REPO}@${DEPLOY_BRANCH}"

          # Check reachability first, so a credentials problem is never reported
          # as a history problem. GitHub answers "not found" (not "forbidden")
          # for private repos a token cannot see, so the two look alike here but
          # have completely different fixes.
          if ! git ls-remote "${REMOTE}" >/dev/null 2>&1; then
            echo "::error::MIRROR_TOKEN cannot reach ${DEPLOY_REPO}."
            echo "GitHub reports 'not found' rather than 'forbidden' for a private repo the"
            echo "token cannot see, so this is almost always token scope — not a missing repo."
            echo "Verify, in order:"
            echo "  1. The token's Resource owner is the account that OWNS ${DEPLOY_REPO}."
            echo "     A fine-grained token cannot reach another personal account's repo,"
            echo "     even if you are a collaborator on it."
            echo "  2. Repository access lists that repository."
            echo "  3. Repository permissions include Contents: Read and write."
            echo "  4. The token has not expired."
            echo "See docs/DEPLOY_MIRROR.md (Failure modes)."
            exit 1
          fi

          # Deliberately NOT a force push. If the deploy repo has commits we
          # don't have, we want a loud failure rather than destroying them.
          if git push "${REMOTE}" "HEAD:${DEPLOY_BRANCH}"; then
            echo "Mirrored successfully."
          else
            echo "::error::Push to ${DEPLOY_REPO}@${DEPLOY_BRANCH} was rejected."
            echo "The repo is reachable, so this is most likely divergence — it has commits"
            echo "that are not in this repo — or the token lacks Contents: write."
            echo "See docs/DEPLOY_MIRROR.md (Divergence)."
            exit 1
          fi

      - name: Reminder
        run: |
          echo "Code is mirrored. Render has autoDeploy disabled, so finish in the"
          echo "Render dashboard: attest-api -> Manual Deploy -> Deploy latest commit."
